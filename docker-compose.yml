services:
  postgres:
    image: postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-image_rating}
      POSTGRES_USER: ${POSTGRES_USER:-image_rating}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_PATH: /app/data/image-rating.sqlite
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-image_rating}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-image_rating}}
      UPLOAD_DIR: /app/uploads
    volumes:
      - /data/sunwenxiu/rating/sqlite:/app/data
      - /data/sunwenxiu/rating/uploads:/app/uploads
      - /data/sunwenxiu/rating/inbox:/app/inbox

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
