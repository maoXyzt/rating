services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_PATH: /app/data/image-rating.sqlite
      UPLOAD_DIR: /app/uploads
    volumes:
      - /data/sunwenxiu/rating/sqlite:/app/data
      - /data/sunwenxiu/rating/uploads:/app/uploads
      - /data/sunwenxiu/rating/inbox:/app/inbox

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes: {}
